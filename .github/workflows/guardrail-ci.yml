# 가드레일 CI. 모든 PR에서 돌고, guardrail/을 건드린 경우에만 lint·test를 실행한다.
# 작업은 `guardrail / gate` 하나다(Actions는 작업마다 분 단위로 올림해 청구하므로 예전의
# changes·lint·test·gate 네 작업을 단계로 합쳤다. 검사 명령은 같다). 필수 검사도 이 하나다.
# 경로 필터를 workflow가 아니라 단계에 둔 이유: 필터로 workflow 자체가 안 돌면
# 필수 검사가 보고되지 않아 guardrail/을 건드리지 않은 PR이 영영 대기한다.
# 비밀 키 검사는 여기서 하지 않는다: `integration / gate`가 같은 gitleaks 8.30.1로 저장소 전체를
# 모든 PR에서 검사한다(예외 경로 competition/public·kb는 guardrail/과 겹치지 않는다).
# PR 본문 수정(edited)에는 돌지 않는다. base 브랜치를 바꾼 뒤에는 PR을 닫았다 다시 열어야
# 새 base 기준으로 다시 돈다.
name: guardrail-ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths: ["guardrail/**", "pyproject.toml", "uv.lock", ".github/workflows/guardrail-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardrail-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: guardrail / gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0: 변경 경로 판별이 base...head 를 비교한다
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 변경 경로 판별
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # push는 경로 필터를 통과한 경우만, 수동 실행은 필터 없이 온다. 둘 다 항상 전체 검사.
          if [ "$EVENT" != "pull_request" ]; then
            echo "guardrail=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # SHA가 비면 git diff가 HEAD 기준으로 조용히 바뀐다. 빈 값은 실패로 본다.
          : "${BASE_SHA:?}" "${HEAD_SHA:?}"
          # 목록을 파일로 먼저 받아 diff 실패가 "변경 없음"으로 바뀌지 않게 한다.
          # -z·quotepath=false: 한글 등 비ASCII 파일명이 따옴표로 감싸져 필터를 빠져나가는 것을 막는다.
          # --no-renames: guardrail/ 밖으로 옮긴 파일도 변경으로 잡는다.
          list="$RUNNER_TEMP/changed-files"
          git -c core.quotepath=false diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" > "$list"
          # grep 종료 코드: 0=일치, 1=불일치, 2 이상=오류. 오류를 "변경 없음"으로 보지 않고 작업을 실패시킨다.
          rc=0
          grep -zqE '^(guardrail/|pyproject\.toml$|uv\.lock$|\.github/workflows/guardrail-ci\.yml$)' "$list" || rc=$?
          case "$rc" in
            0) echo "guardrail=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "guardrail=false" >> "$GITHUB_OUTPUT"; echo "guardrail/ 변경 없음: lint·test는 건너뛴다" ;;
            *) echo "::error::변경 파일 검사 실패 (grep $rc)"; exit 1 ;;
          esac
      # ── lint·test: guardrail/을 건드렸을 때만. 앞 단계가 실패하면 뒤 단계는 돌지 않고 작업이 실패한다 ──
      - if: steps.diff.outputs.guardrail == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock  # lock은 루트 하나(uv workspace). guardrail/에서 sync해도 루트 lock을 쓴다
      - if: steps.diff.outputs.guardrail == 'true'
        working-directory: guardrail
        run: uv sync --locked
      # ruff 규칙에 S(bandit 보안 규칙)가 포함된다. 설정은 pyproject.toml.
      - if: steps.diff.outputs.guardrail == 'true'
        working-directory: guardrail
        run: uv run ruff check .
      - if: steps.diff.outputs.guardrail == 'true'
        working-directory: guardrail
        run: uv run ruff format --check .
      # 실제 LLM API는 부르지 않는다(키 없음). live 표시 테스트는 로컬에서만 돈다.
      - if: steps.diff.outputs.guardrail == 'true'
        working-directory: guardrail
        run: uv run pytest --cov=guardrail --cov-report=term-missing --cov-fail-under=80
