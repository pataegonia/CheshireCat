# 통합·평가 CI. 모든 PR에서 돈다. 작업은 `integration / gate` 하나다(작업마다 분 단위로 올림해 청구되므로
# 예전의 changes·test·rules·secrets·gate 다섯 작업을 단계로 합쳤다. 검사 내용은 같다).
# 단계 순서: checkout → 변경 경로 판별 → 비밀 키 검사(경로와 무관하게 항상) → 통합 영역을 건드렸을 때만
# lint·test → 대회 규칙 검사 다섯 가지. 대회 규칙 단계는 앞 단계가 실패해도 돌아 결과를 한 번에 볼 수 있다.
# 어느 단계든 하나라도 실패하면 작업이 실패한다(변경 경로 판별 실패 포함).
# 통합 영역 = 런박스에 뜨는 앱이나 통합 테스트 결과를 바꿀 수 있는 경로: app.py, integration/, tutor/,
# harness/, config/, tests/, competition/(테스트가 공개 세트·교재·채점 코드를 읽는다), 루트 pyproject.toml·uv.lock,
# 이 파일, 그리고 가드에서는 앱에 영향을 주는 곳만(guardrail/src/, guardrail/configs/, guardrail/docs/contract/,
# guardrail/pyproject.toml). 문서 폴더 tutor/docs/ · integration/docs/ 는 통합 영역이 아니다(코드와 테스트가 읽지 않는다.
# tutor/prompts/ 는 코드가 읽으므로 통합 영역이다). 가드 문서·가드 단위 테스트만 고친 PR에서도 돌지 않는다(guardrail-ci가 본다).
# 가드·튜터 PR이 조립을 깨면 그 PR에서 걸리게 한다(tests/integration/test_e2e.py, S1 I1.7).
# on.push.paths와 변경 경로 판별 단계는 같은 범위다(한쪽을 고치면 다른 쪽도 고친다).
# PR 본문 수정(edited)에는 돌지 않는다: 결과가 같은 실행을 되풀이하지 않는다. 그래서 base 브랜치를 바꾼 뒤에는
# PR을 닫았다 다시 열어야 테스트가 새 base 기준으로 다시 돈다.
# 대회 규칙 중 금지 의존성 검사는 guardrail/의 의존성 파일까지, 비밀 키 검사는 저장소 전체를 본다
# (제출물이 저장소 전체이기 때문. guardrail-ci는 guardrail/ 코드 품질만 본다).
# 머지 전 확인할 검사는 `integration / gate` 하나다(비밀 키 검사도 이 안에서 돈다).
name: integration-ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - "app.py"
      - "integration/**"
      - "tutor/**"
      - "guardrail/src/**"
      - "guardrail/configs/**"
      - "guardrail/docs/contract/**"
      - "guardrail/pyproject.toml"
      - "harness/**"
      - "config/**"
      - "tests/**"
      - "competition/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/integration-ci.yml"
      # 문서 폴더는 뺀다(변경 경로 판별 단계와 같은 범위)
      - "!tutor/docs/**"
      - "!integration/docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: integration / gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # fetch-depth 0: 변경 경로 판별이 base...head 를 비교한다
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 변경 경로 판별
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          list="$RUNNER_TEMP/changed-files"
          git -c core.quotepath=false diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" > "$list"
          rc=0
          # 문서 폴더(tutor/docs/, integration/docs/)만 바뀐 것은 통합 영역이 아니다. 그 둘을 먼저 걸러 낸다
          # (grep -v 는 남는 줄이 없으면 1을 낸다. 그것은 오류가 아니다).
          code="$RUNNER_TEMP/changed-files-without-docs"
          frc=0
          grep -zvE '^(tutor/docs/|integration/docs/)' "$list" > "$code" || frc=$?
          if [ "$frc" -gt 1 ]; then echo "::error::변경 파일 검사 실패 (grep -v $frc)"; exit 1; fi
          grep -zqE '^(app\.py$|integration/|tutor/|guardrail/src/|guardrail/configs/|guardrail/docs/contract/|guardrail/pyproject\.toml$|harness/|config/|tests/|competition/|pyproject\.toml$|uv\.lock$|\.github/workflows/integration-ci\.yml$)' "$code" || rc=$?
          case "$rc" in
            0) echo "integration=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "integration=false" >> "$GITHUB_OUTPUT"; echo "통합 영역 변경 없음: lint·test·대회 규칙 검사는 건너뛴다" ;;
            *) echo "::error::변경 파일 검사 실패 (grep $rc)"; exit 1 ;;
          esac
      # ── 비밀 키 검사: 경로와 무관하게 항상(변경 경로 판별이 실패하면 돌지 않고 작업이 실패한다) ──
      # uv sync 앞에 둔다: 그 뒤에는 작업 폴더에 .venv 가 생긴다
      - name: gitleaks 설치 (해시 고정)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
      # 저장소 전체 현재 파일. guardrail-ci의 guardrail/ 한정 검사를 보완한다. 찾은 값은 가린다.
      # competition/public·kb에는 PII 예시(전화번호·계좌 형태)가 들어 있어 .gitleaks.toml에서 경로를 제외한다.
      - name: 저장소 전체 비밀 키 검사
        run: ./gitleaks dir . --no-banner --redact --config .gitleaks.toml
      # ── lint·test: 통합 영역을 건드렸을 때만 ──
      # 앞 단계가 성공했을 때만 다음으로 간다(setup-uv → uv sync → lint → pytest). 조건을 success() 대신 단계 결과로
      # 적은 것은 비밀 키 검사가 실패해도 lint·test 결과를 보기 위해서다(예전에는 다른 작업이라 서로 무관했다).
      # 루트 pyproject.toml이 생기기 전(문서·CI만 있는 PR)에는 건너뛴다. 생긴 뒤에는 반드시 돈다.
      # setup-uv도 그 뒤에 둔다: 캐시할 게 없으면 post 단계가 "Cache path does not exist"로 job을 실패시킨다.
      - name: 프로젝트 유무 확인
        if: ${{ !cancelled() && steps.diff.outputs.integration == 'true' }}
        id: proj
        run: |
          if [ -f pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::warning::루트 pyproject.toml 없음 — lint·test 건너뜀 (통합 코드가 들어오면 반드시 추가)"; fi
      - id: uv
        if: ${{ !cancelled() && steps.proj.outputs.present == 'true' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - id: sync
        if: ${{ !cancelled() && steps.uv.outcome == 'success' }}
        run: uv sync --locked --all-packages  # 멤버(가드·튜터)와 각자의 dev 그룹까지
      # 존재하는 경로만 검사한다(tutor/ 등이 아직 없을 수 있다).
      # tutor/는 튜터 설정(tutor/pyproject.toml)으로 따로 돈다: 루트 설정으로 보면 import 정렬 기준이 달라 I001이 난다.
      - id: lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          targets=$(ls -d app.py integration harness 2>/dev/null | tr '\n' ' ')
          echo "lint targets: $targets"
          uv run ruff check $targets
          uv run ruff format --check $targets
          if [ -d tutor ]; then
            uv run ruff check --config tutor/pyproject.toml tutor
            uv run ruff format --check --config tutor/pyproject.toml tutor
          fi
      # 실제 LLM API는 부르지 않는다(키 없음). 계약 테스트는 FakeLLM으로 돈다:
      # 퍼징 입력 → 전부 200 + 스키마, /tutor/ 3xx 없음, 전역 예외 → 200, 로그에 본문 없음.
      - id: pytest
        if: ${{ !cancelled() && steps.lint.outcome == 'success' }}
        run: |
          if [ ! -d tests/integration ]; then echo "::error::루트 pyproject.toml은 있는데 tests/integration이 없다 — 통합 코드는 계약 테스트와 함께 들어온다"; exit 1; fi
          # 튜터 테스트도 여기서 돈다(튜터 전용 CI 없음, 리더 제안). 커버리지 80%는 integration 패키지에만 건다.
          dirs="tests/integration"; [ -d tests/tutor ] && dirs="$dirs tests/tutor"
          uv run pytest $dirs --cov=integration --cov-report=term-missing --cov-fail-under=80
      # ── 대회 규칙: 통합 영역을 건드렸으면 앞 단계가 실패해도 돈다(결과를 한 번에 본다) ──
      # SPEC §7 "미리 학습된 모델 파일(임베딩·리랭커·분류 모델)"을 끌어오는 패키지. 제출물은 저장소 전체이므로 guardrail/의 의존성 파일도 같이 본다(guardrail-ci에는 이 검사가 없다).
      - name: 금지 의존성 (SPEC §7.1)
        if: ${{ !cancelled() && steps.diff.outputs.integration == 'true' }}
        run: |
          set -euo pipefail
          # 저장소 전체의 의존성 파일(tutor/·guardrail/ 포함). 제출물이 저장소 전체이기 때문.
          files=$(git ls-files 'pyproject.toml' '*/pyproject.toml' 'uv.lock' '*/uv.lock' 'requirements*.txt' '*/requirements*.txt' 'setup.cfg' 'setup.py')
          if [ -z "$files" ]; then echo "의존성 파일 없음: 통과"; exit 0; fi
          # 보수적 목록: SPEC §7.1이 금지하는 것은 "미리 학습된 모델 파일(임베딩·리랭커·분류)"과 외부 API이고 torch·onnxruntime·faiss 자체는 허용이다.
          # 그래도 막는 이유: 사전학습 가중치가 들어오는 주 경로라 실격 위험 > 편의. 필요해지면 회의로 해제한다.
          # tiktoken·huggingface-hub: 실행 중 파일을 내려받는 패키지(런박스에서 외부 다운로드 = 실격 경로).
          banned='(^|[[:space:]"'"'"'=])(torch|torchvision|transformers|sentence-transformers|onnxruntime|faiss-cpu|faiss-gpu|flagembedding|flashrank|cohere|anthropic|google-generativeai|tavily-python|duckduckgo-search|tiktoken|huggingface-hub|huggingface_hub)([[:space:]"'"'"'>=<\[,]|$)'
          # uv.lock의 name = "..." 줄, pyproject의 "pkg>=x" 항목, requirements의 pkg==x 줄을 모두 잡는다. 주석 줄은 뺀다
          if grep -HniE "$banned" $files | grep -vE '^[^:]+:[0-9]+:\s*#' ; then
            echo "::error::금지 의존성이 있다 (미리 학습된 모델 파일·외부 API·런타임 다운로드). SPEC §7.1 참고, 해제는 회의로"; exit 1
          fi
          echo "금지 의존성 없음"
      # 외부 호출은 OPENAI_BASE_URL·EMBEDDING_BASE_URL 환경변수로만. 코드에 URL 리터럴이 있으면 실패(운영진 터널 주소도 .env에만 둔다).
      - name: 외부 URL 리터럴 (SPEC §7)
        if: ${{ !cancelled() && steps.diff.outputs.integration == 'true' }}
        run: |
          set -euo pipefail
          targets=$(ls -d app.py integration tutor harness 2>/dev/null || true)
          if [ -z "$targets" ]; then echo "통합 코드 없음: 통과"; exit 0; fi
          # grep -rn 출력은 '경로:줄번호:내용'이므로 주석 제외는 그 접두 뒤에서 본다
          hits=$(grep -rnE 'https?://' $targets --include='*.py' | grep -vE '^[^:]+:[0-9]+:\s*#' | grep -vE 'localhost|127\.0\.0\.1|0\.0\.0\.0|"""' || true)
          if [ -n "$hits" ]; then
            echo "$hits"; echo "::error::코드에 외부 URL 리터럴이 있다. 운영진 API는 환경변수로만 부른다"; exit 1
          fi
          echo "외부 URL 리터럴 없음"
      # 요청·답변 본문을 로그에 남기는 코드 (SPEC §8). 정적 검사라 거칠지만 가장 흔한 실수를 막는다.
      - name: 본문 로깅 정적 검사 (SPEC §8)
        if: ${{ !cancelled() && steps.diff.outputs.integration == 'true' }}
        run: |
          set -euo pipefail
          # 요청 본문을 다루는 코드 전부: 가드 포함(guardrail-ci에는 이 검사가 없다). tests/는 제외.
          targets=$(ls -d app.py integration tutor guardrail/src 2>/dev/null || true)
          if [ -z "$targets" ]; then echo "통합 코드 없음: 통과"; exit 0; fi
          # 접두 '경로:줄번호:' 뒤에서 주석을 거르고, 본문 변수가 len(...) 안에만 있는 줄은 통과시킨다(len( 밖에 본문 변수가 남으면 실패)
          hits=$(grep -rnE '(print|logger\.[a-z]+|logging\.[a-z]+|log\.[a-z]+)\(.*\b(messages|candidate_answer|req\.|request\.body|answer|content|prompt)\b' $targets --include='*.py' \
                 | grep -vE '^[^:]+:[0-9]+:\s*#' | grep -v '# log-ok' \
                 | awk '{ line=$0; sub(/^[^:]+:[0-9]+:/, "", line); gsub(/len\([^)]*\)/, "", line); if (line ~ /(^|[^a-zA-Z0-9_])(messages|candidate_answer|req\.|request\.body|answer|content|prompt)([^a-zA-Z0-9_]|$)/) print $0 }' || true)
          if [ -n "$hits" ]; then
            echo "$hits"; echo "::error::로그·print에 요청/답변 본문으로 보이는 값이 들어간다. 길이·상태·오류만 남긴다. 오탐이면 줄 끝에 '# log-ok'"; exit 1
          fi
          echo "본문 로깅 패턴 없음"
      # 런타임 로그 검사: 서버가 있을 때만. FakeLLM으로 공개 세트 20건을 돌리고 로그를 grep한다.
      - name: 런타임 로그 grep (SPEC §8)
        if: ${{ !cancelled() && steps.diff.outputs.integration == 'true' }}
        run: |
          if [ -x harness/check_logs.sh ]; then harness/check_logs.sh --ci; else echo "::warning::harness/check_logs.sh 없음 — 통합 코드가 들어오면 추가"; fi
      # 제출 양식 자리표시가 실제 값으로 바뀐 채 커밋되는 것을 막는다.
      - name: submission.json · .env 미커밋
        if: ${{ !cancelled() && steps.diff.outputs.integration == 'true' }}
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch competition/.env >/dev/null 2>&1 || git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env가 커밋돼 있다"; exit 1
          fi
          for f in $(git ls-files '*submission.json' 'submission.json'); do
            if ! grep -q '"token": "my-token"' "$f"; then
              echo "::error::$f 에 실제 토큰이 들어 있다. 양식 그대로 두고 런박스에서만 채운다"; exit 1
            fi
          done
          echo "제출 양식·.env 정상"
