# PR 정책 검사. 경로 필터 없이 모든 PR에서 돈다.
# 필수 검사로 지정: `pr-policy / attribution`, `pr-policy / zizmor`
# 필수 아님(경고·자동 처리): `pr-policy / hygiene`
name: pr-policy

on:
  pull_request:
    # edited가 없으면 PR 본문을 고쳐도 검사가 다시 돌지 않는다
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  attribution:
    name: pr-policy / attribution
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // AI 도구 자동 서명 문구. 대소문자 무시.
            const PATTERNS = [
              /generated with \[?claude code/i,
              // 이름이 Claude인 사람과 구분하려고 Anthropic 주소로만 판단한다
              /co-authored-by:[^\n]*noreply@anthropic\.com/i,
            ];
            const hit = (text) => PATTERNS.some((re) => re.test(text || ""));
            const pr = context.payload.pull_request;

            // 커밋 메시지는 경고만: 고치려면 히스토리를 다시 써야 해서 막지 않는다
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            for (const c of commits) {
              if (hit(c.commit.message)) {
                core.warning(`커밋 ${c.sha.slice(0, 7)} 메시지에 AI 도구 서명 문구가 있다. 다음 커밋부터 빼 달라.`);
              }
            }

            const failed = [];
            if (hit(pr.title)) failed.push("PR 제목");
            if (hit(pr.body)) failed.push("PR 본문");
            if (failed.length > 0) {
              core.setFailed(
                `${failed.join(", ")}에 AI 도구 서명 문구(Generated with … / Co-Authored-By: …)가 있다. ` +
                "해당 줄을 지우면 이 검사가 다시 돈다. 출처 차단 설정은 .claude/settings.json 참고."
              );
            }

  zizmor:
    name: pr-policy / zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.17"
      # high 등급만 실패로 처리한다. 낮은 등급은 로컬에서 `uvx zizmor .github`로 본다.
      # 온라인 감사(가짜 커밋 SHA, 취약 버전 액션)를 쓰려고 토큰을 넘긴다. 읽기 권한뿐이다.
      - name: workflow·dependabot 보안 검사 (high만 실패)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --from zizmor==1.31.1 zizmor --min-severity high .github

  hygiene:
    name: pr-policy / hygiene
    # 봇 PR(dependabot 등)은 담당자·이슈 연결 대상이 아니다
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // 재실행 시 이벤트 payload가 오래된 값일 수 있어 최신 PR 정보를 다시 읽는다
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            // 담당자가 없으면 작성자를 지정한다. fork PR은 토큰이 읽기 전용이라 경고만 남긴다.
            if ((pr.assignees || []).length === 0) {
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  assignees: [pr.user.login],
                });
                core.info(`담당자를 ${pr.user.login}(으)로 지정했다.`);
              } catch (err) {
                core.warning(`담당자 자동 지정 실패: ${err.message}`);
              }
            }

            // 이슈 연결은 경고만. Closes #N은 main으로 가는 PR에서만 이슈를 자동으로 닫는다.
            const LINK = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i;
            if (!LINK.test(pr.body || "")) {
              core.warning("PR 본문에 연결된 이슈가 없다. `Closes #번호`를 적어 달라.");
            }
