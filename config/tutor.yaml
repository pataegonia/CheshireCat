# 튜터 설정(TU-14). 형식은 가드 GR-11과 같다: 모든 키가 필수이고 모르는 키는 로드에서 실패한다.
# 기동 때 한 번 읽는다(tutor.startup). ablation 프리셋은 이 파일 위에 깊은 병합한다(통합 하네스 IN-06).
# 공유 키 budget_s는 가드 설정, judge_skip_s·fallback_action은 config/runtime.yaml(통합)에 있다.
# 키·주소는 여기에 쓰지 않는다(.env 환경변수). 값은 엄격히 본다: off는 따옴표로("off", YAML에서 off는 false).
version: "tutor-1"
mode: v2                       # v2 | baseline(검색 상위 3개 + 일반 튜터 프롬프트 1회 + 형식 후처리, 토글은 모두 끔)
toggles:
  name_dict: false             # 이름 사전(TU-04). 순위 올리기 방식은 채택 안 함(#81: recall@1 하락). 힌트 방식은 #82에서 잰다
  fewshot: "off"               # "off" | fixed | knn. 공개 세트 판단 예시(TU-08). 끔 / 고정 / kNN을 3회씩 비교해 순이득이 있을 때만 켠다
  action_from_category: false  # 범주 → action 표 강제. 기본 끔, 켜도 answer 쪽으로는 덮지 않음(TU-06)
  signals: true                # 결정적 신호 힌트(TU-05)
  verify: guard                # off | self | guard. 가드 judge_output 검증, v1 기본 켬(TU-09)
  guard_classify: parallel     # off | serial | parallel. 가드 classify 합치기, 기본 parallel(TU-10)
  embedding: false             # 질의 임베딩(TU-11). recall@1이 오르지 않아 끔(#81). 기본 0회
  rerank: false                # nano로 섹션 다시 고르기. 요청당 호출 상한을 넘어 동결 설정에 쓰지 않음(TU-13)
  vote: false                  # action 투표(병렬 3회). 요청당 호출 상한을 넘어 동결 설정에 쓰지 않음(TU-13)
  scaffold_state_rule: false   # answer_seeking에서 정답 사실을 먼저 밝힘(true) / 숨김(false)(TU-06). true면 과제 대행 보정(flow.delegation_guard)도 켠다. 11/14 측정으로 숨김(전체 이득 없음, 과제 대행 행 0점 증가). T3에서 운영진 답(§11-1-4)과 함께 다시 본다
  inline_cite: false           # 답변 끝 (섹션 ID) 표기. 켜면 citations와 같은 ID를 붙인다(TU-07, #82 ablation)
  max_citations: 1             # 1 | 2. 공개 세트 근거 2개 행 0(#82 집계)이라 2는 이득 없음(TU-07)
fewshot:                       # 판단 예시 고르기(TU-08). 가드 GR-05 input.knn과 같은 값
  ngram: [1, 3]                # 문자 n-gram(char_wb) 범위
  max_examples: 8              # knn 전체 상한(4–8)
  per_category: 2              # knn 범주당 상한
  with_answer: false           # 예시에 정답 답변도 붙이는가. 기본 끔(다른 섹션 사실이 섞이고 answer_seeking 숨김 방식과 충돌), ablation
retrieval:
  k: 5                         # 근거 묶음 섹션 수. recall@5 = @8 = 0.958(#81), 판정 3회 비교에서 3은 분산 안(11/13)
answer:
  max_sentences: 3             # 1–3문장 기본(상한 아님, TU-06)
llm:
  reasoning_effort: low        # low | medium. minimal 금지(TU-13). 가드 probe가 끈 파라미터는 보내지 않는다
  max_completion_tokens: 1600  # 주 호출 상한(추론 토큰 포함). 가드 판정 호출(800)과 따로, 주 호출 실측(finish_reason=length 비율) 뒤 정함. 운영진 프록시 상한 2000(넘기면 400, 로드에서 실패)
  timeout_s:                   # 호출당 시간 제한(TU-13). 주 호출은 T1 실측으로 정함
    main: 15                   # 주 호출. T1 실측으로 8초에서 올림(#73): 8초는 v2 출력이 길어 재시도 36%, 15초는 재시도 0·동시 8 지연 최대 14.45초. 보낸 시각부터 센다
    classify: 5                # 가드 classify(주 호출과 병렬). 부른 때부터 센다, 게이트 대기 포함
    verify: 5                  # 검증·judge_output
    embedding: 2
eval:
  max_calls: 5000              # 개발 실행 운영진 API 호출 상한(TU-14, 가드 GR-11과 같음)
