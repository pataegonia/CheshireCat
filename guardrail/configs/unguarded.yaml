# 무방비 모드 (master-plan §4.4, GR-12). 위기까지 모든 가드 단계를 끈다. 전후 비교의 "가드 적용 전" 설정이다.
# 가드 토글은 끝까지 모두 false다. tutor 절은 S3.1이 default.yaml과 같게 맞춘다(같은 튜터로 비교).
# 키·base URL은 여기에 쓰지 않는다. 환경변수 GUARD_LLM_BASE_URL·GUARD_LLM_API_KEY로만 받는다.
policy_version: "0.1.0"          # 정책 프롬프트·템플릿·임계값이 바뀌면 올린다
mode: eval                       # eval | service (GR-13)
pipeline: {mode: parallel}       # parallel | serial (ADR-0007 대안 A)
stages:                          # GR-12 단계 묶음 4개 + 위기
  crisis: false                  # 무방비 모드에서만 끈다(평가 모드 전용)
  input:   {rules: false, pii: false, judge: false, jev: false}
  session: {enabled: false}
  retrieval: {enabled: false}
  output:  {code: false, prefilter: false, judge: false, repair: false, r2: false}
policy:
  d1: s2                         # PRD §9 D1. s2 | s1_s2
models:                          # 역할별 모델. 이름은 게이트웨이 목록이 나오면 채운다(판정은 생성과 다른 계열, ADR-0004)
  generator: ${GEN_MODEL}
  input_judge: ${JUDGE_MODEL}
  exchange_judge: ${JUDGE_MODEL}
  attack_judge: ${JUDGE_MODEL}   # 생성·판정과 다른 셋째 계열이 있으면 그 모델 이름을 여기에 바로 적는다
  jev: typesafe-ai/jev-1.14.0
thresholds: {input_block: 0.0, tau_J: null, tau_m: null, theta: 0.9, G: 0.7, R_expand: 0.5, lambda: 0.9}
context_turns: {base: 4, expanded: 8}
deadlines_s: {input_judge: 2.5, exchange_judge: 3.0, generator: 20.0, jev: 1.5, attack_judge: 10.0, tutor_retrieve: 5.0}
gate: {initial: 4, min: 1, max: 16, increase_after: 10, max_wait_s: 30, structured_output: json_schema}
tutor:                           # GR-11 튜터 쪽 의무. 모의 튜터는 다 지원한다
  adapter: mock                  # mock | real
  obligations: {cites: true, canary: true, wraps_chunks: true, non_streaming: true, regenerate: true}
service_log: {retention_days: 30, keep_raw_for: [block, escalation, appeal, sample], sample_rate: 0.01, path: logs/service-trace.jsonl}
faults: {}                       # 평가 전용 장애 주입. 예: {input_judge: timeout}
paths: {prompts: prompts, resources: resources}
