[project]
name = "guardrail"
version = "0.1.0"
description = "CheshireCat AI 튜터용 가드레일 모듈"
requires-python = ">=3.12"
dependencies = [
    "openai>=3,<4",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "hypothesis>=6.170.14",
    "pytest>=8",
    "pytest-cov>=7",
    "ruff>=0.6",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "scripts"]  # 조사 메모의 코드 블록과 R13 측정 스크립트는 기록이라 손대지 않는다(수치 재현 대상)

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]  # S: bandit 보안 규칙

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]  # 테스트의 assert와 시드 고정 random은 정상

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 실제 API 호출. CI에서 돌지 않음"]
addopts = "-m 'not live'"
