# 저장소 루트 프로젝트: 서버 한 개(app.py)가 쓰는 실행 환경을 정한다(통합 PRD §5, #64 리뷰).
#
# - uv workspace이고 lock은 이 폴더의 uv.lock 하나다. 멤버는 guardrail/ 과 tutor/.
#   guardrail/ 이나 tutor/ 안에서 uv 명령을 돌려도 이 lock과 루트 .venv 를 쓴다.
# - 가드는 설치되는 패키지(src 레이아웃)이고, 튜터는 설치하지 않는 멤버(package = false)라 저장소 루트에서
#   import한다. integration/ · harness/ · app.py 도 루트에서 import한다.
# - 그래서 서버와 테스트는 저장소 루트에서 실행한다.
[project]
name = "cheshirecat"
version = "0.1.0"
description = "대회 서버: POST /guard + POST /tutor"
requires-python = ">=3.12"
dependencies = [
    "guardrail",
    "tutor",
    "pydantic>=2.14.2",  # integration/contracts.py · actions.py
    "pyyaml>=6.0.3",  # config/*.yaml
]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "httpx>=0.28.1",
    "hypothesis>=6.170.14",
    "jsonschema==4.26.0",
    "pytest>=8",
    "pytest-cov>=7",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["guardrail", "tutor"]

[tool.uv.sources]
guardrail = { workspace = true }
tutor = { workspace = true }

# 통합 코드(integration/ · harness/ · app.py · tests/integration)에 쓰는 설정이다.
# guardrail/ · tutor/는 각자 폴더의 pyproject.toml 설정을 따른다(ruff는 가장 가까운 설정을 쓴다).
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["guardrail", "competition", "docs"]  # 문서의 코드 블록은 손대지 않는다

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]  # S: bandit 보안 규칙, T20: print 금지

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]  # 테스트의 assert와 시드 고정 random은 정상

[tool.ruff.lint.isort]
known-first-party = ["integration", "harness", "tutor", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["integration"]
